name: Rust

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux-musl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Install musl tools
      run: |
        sudo apt update
        sudo apt install -y musl-tools
    - name: Install protobuf for musl
      run: |
        sudo apt install -y libprotobuf-dev protobuf-compiler
    - name: Add musl target
      run: rustup target add x86_64-unknown-linux-musl
    - name: Build Linux musl
      run: cargo build --verbose --release --target=x86_64-unknown-linux-musl
    - name: Upload Linux musl artifact
      uses: actions/upload-artifact@v4
      with:
        name: file_deploy-linux-musl
        path: target/x86_64-unknown-linux-musl/release/file_deploy

  build-windows:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Install protobuf
      run: sudo apt install libprotobuf-dev protobuf-compiler -y
    - name: Install Mingw
      run: sudo apt install mingw-w64 -y
    - name: Install Windows target
      run: rustup target add x86_64-pc-windows-gnu
    - name: Build Windows
      run: cargo build --verbose --release --target=x86_64-pc-windows-gnu
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: file_deploy-windows
        path: target/x86_64-pc-windows-gnu/release/file_deploy.exe



  release:
    needs: [build-linux-musl, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - uses: actions/checkout@v4
    - name: Download Linux musl binary
      uses: actions/download-artifact@v4
      with:
        name: file_deploy-linux-musl
        path: ./artifacts/linux-musl
    - name: Download Windows binary
      uses: actions/download-artifact@v4
      with:
        name: file_deploy-windows
        path: ./artifacts/windows
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./artifacts/linux-musl/file_deploy
          ./artifacts/windows/file_deploy.exe